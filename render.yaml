databases:
  - name: backend-productivity-db
    plan: free

services:
  - type: web
    name: backend-productivity-app
    runtime: python
    plan: free
    buildCommand: "pip install pipenv && pipenv install --deploy --system && flask db upgrade"
    startCommand: "gunicorn app:app"
    envVars:
      - key: FLASK_APP
        value: app.py
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        fromDatabase:
          name: backend-productivity-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
